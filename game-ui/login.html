<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MoveWall AI — Therapist Login</title>
    <meta name="description" content="Login portal for MoveWall AI therapists. Access the interactive shoulder rehabilitation system." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="login-page">
    <!-- Animated background particles -->
    <div class="login-bg" aria-hidden="true">
      <div class="login-bg-orb orb-1"></div>
      <div class="login-bg-orb orb-2"></div>
      <div class="login-bg-orb orb-3"></div>
      <div class="login-bg-grid"></div>
    </div>

    <main class="login-shell">
      <!-- Brand header -->
      <div class="login-brand">
        <div class="login-logo-wrap">
          <span class="login-logo-icon">🧠</span>
        </div>
        <div class="login-brand-text">
          <span class="login-brand-name">MoveWall AI</span>
          <span class="login-brand-tagline">Therapist Portal</span>
        </div>
      </div>

      <!-- Login card -->
      <div class="login-card" role="main">
        <div class="login-card-header">
          <h1 class="login-title">Selamat Datang</h1>
          <p class="login-subtitle">Masuk dengan akun terapis Anda untuk memulai sesi rehabilitasi.</p>
        </div>

        <!-- Error alert (hidden by default) -->
        <div id="loginError" class="login-alert login-alert-error hidden" role="alert" aria-live="polite">
          <span class="login-alert-icon">⚠️</span>
          <span id="loginErrorText">Username atau password salah.</span>
        </div>

        <!-- Success alert (hidden by default) -->
        <div id="loginSuccess" class="login-alert login-alert-success hidden" role="alert" aria-live="polite">
          <span class="login-alert-icon">✅</span>
          <span id="loginSuccessText">Login berhasil! Mengalihkan...</span>
        </div>

        <form id="loginForm" class="login-form" novalidate>
          <div class="login-field">
            <label for="loginUsername" class="login-label">Username</label>
            <div class="login-input-wrap">
              <span class="login-input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input
                id="loginUsername"
                name="username"
                type="text"
                class="login-input"
                placeholder="Masukkan username"
                autocomplete="username"
                required
              />
            </div>
          </div>

          <div class="login-field">
            <label for="loginPassword" class="login-label">Password</label>
            <div class="login-input-wrap">
              <span class="login-input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input
                id="loginPassword"
                name="password"
                type="password"
                class="login-input"
                placeholder="Masukkan password"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                id="togglePassword"
                class="login-toggle-pw"
                aria-label="Toggle password visibility"
              >
                <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button id="loginSubmitBtn" type="submit" class="login-btn">
            <span id="loginBtnText">Masuk ke Sistem</span>
            <span id="loginBtnLoader" class="login-btn-loader hidden" aria-hidden="true"></span>
          </button>
        </form>

        <div class="login-card-footer">
          <p class="login-hint">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            Demo credentials: <strong>therapist01</strong> / <strong>movewall2026</strong>
          </p>
        </div>
      </div>

      <!-- Version badge -->
      <div class="login-footer">
        <span>MoveWall AI &copy; 2026</span>
        <span class="login-footer-dot">·</span>
        <span>Therapist Portal v1.0</span>
      </div>
    </main>

    <script>
      /* ── Config ─────────────────────────────────────────── */
      const API_BASE = "http://localhost:3001/api";

      /* ── Guard: jika sudah login, redirect ke game ──────── */
      (function checkExistingSession() {
        const token = sessionStorage.getItem("mw_token");
        if (token) {
          window.location.replace("./index.html");
        }
      })();

      /* ── DOM refs ────────────────────────────────────────── */
      const form           = document.getElementById("loginForm");
      const usernameInput  = document.getElementById("loginUsername");
      const passwordInput  = document.getElementById("loginPassword");
      const togglePw       = document.getElementById("togglePassword");
      const eyeIcon        = document.getElementById("eyeIcon");
      const submitBtn      = document.getElementById("loginSubmitBtn");
      const btnText        = document.getElementById("loginBtnText");
      const btnLoader      = document.getElementById("loginBtnLoader");
      const errorBox       = document.getElementById("loginError");
      const errorText      = document.getElementById("loginErrorText");
      const successBox     = document.getElementById("loginSuccess");
      const successText    = document.getElementById("loginSuccessText");

      /* ── Toggle password visibility ─────────────────────── */
      togglePw.addEventListener("click", () => {
        const isHidden = passwordInput.type === "password";
        passwordInput.type = isHidden ? "text" : "password";
        eyeIcon.innerHTML = isHidden
          ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
          : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
      });

      /* ── UI helpers ──────────────────────────────────────── */
      function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        btnText.classList.toggle("hidden", isLoading);
        btnLoader.classList.toggle("hidden", !isLoading);
      }

      function showError(msg) {
        errorText.textContent = msg;
        errorBox.classList.remove("hidden");
        successBox.classList.add("hidden");
        errorBox.classList.add("shake");
        setTimeout(() => errorBox.classList.remove("shake"), 500);
      }

      function showSuccess(msg) {
        successText.textContent = msg;
        successBox.classList.remove("hidden");
        errorBox.classList.add("hidden");
      }

      /* ── Form submit handler ─────────────────────────────── */
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username || !password) {
          showError("Username dan password harus diisi.");
          return;
        }

        setLoading(true);
        errorBox.classList.add("hidden");

        try {
          const res = await fetch(`${API_BASE}/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.error || "Login gagal. Coba lagi.");
          }

          // Save token & therapist info to sessionStorage
          sessionStorage.setItem("mw_token", data.token);
          sessionStorage.setItem("mw_therapist", JSON.stringify(data.therapist));

          showSuccess(`Selamat datang, ${data.therapist.name}! Mengalihkan ke sistem...`);

          setTimeout(() => {
            window.location.replace("./index.html");
          }, 1000);

        } catch (err) {
          showError(err.message || "Terjadi kesalahan. Pastikan server backend berjalan.");
          setLoading(false);
        }
      });

      /* ── Auto-focus username ─────────────────────────────── */
      usernameInput.focus();
    </script>
  </body>
</html>
